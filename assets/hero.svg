<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" role="img" aria-label="Sadra Maleki - Full Product Builder">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset=".55" stop-color="#16161e"/>
      <stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset=".5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ff007c"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7aa2f7" stop-opacity="1"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="857" height="227" rx="14" fill="url(#heroBg)"/>
  <rect x="1.5" y="1.5" width="857" height="227" rx="14" fill="none" stroke="url(#frameStroke)" stroke-width="1.5"/>

  <!-- moving top light rail -->
  <rect x="80" y="10" width="700" height="1.6" fill="url(#railGrad)" opacity=".9">
    <animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- window dots -->
  <circle cx="30" cy="34" r="5" fill="#ff5f57"/>
  <circle cx="50" cy="34" r="5" fill="#febc2e"/>
  <circle cx="70" cy="34" r="5" fill="#28c840"/>
  <text x="430" y="39" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#565f89">sadra@github ~ profile.md</text>
  <line x1="20" y1="52" x2="840" y2="52" stroke="#2a2e42" stroke-width="1"/>

  <!-- prompt line -->
  <text x="30" y="86" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#9ece6a">➜</text>
  <text x="52" y="86" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#7aa2f7">~/whoami</text>
  <text x="148" y="86" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#565f89">$</text>

  <!-- name with animated glow -->
  <text x="30" y="126" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-weight="800" font-size="34" fill="url(#nameGrad)" letter-spacing=".5">Hi, I'm Sadra Maleki
    <animate attributeName="opacity" values=".85;1;.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- rotating role lines -->
  <text x="30" y="156" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#565f89">➜</text>
  <text x="52" y="156" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#c0caf5">
    <tspan opacity="1">Building products end-to-end — from idea to deploy<tspan id="caret" fill="#7dcfff">▊</tspan></tspan>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="52" y="156" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#ff9e64">
    <tspan opacity="0">React · Next.js · NestJS · PostgreSQL · Tailwind<tspan fill="#7dcfff">▊</tspan></tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.45;.5;.9;.95;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- status row -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5">
    <text x="30" y="192" fill="#9ece6a">● open to collaboration</text>
    <text x="225" y="192" fill="#7aa2f7">◆ Iran · Remote friendly</text>
    <text x="420" y="192" fill="#bb9af7">✦ Freelance / Self-employed</text>
  </g>

  <!-- animated bottom rail -->
  <rect x="80" y="216" width="700" height="1.6" fill="url(#railGrad)">
    <animate attributeName="opacity" values="1;.3;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
