<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150" role="img" aria-label="Workflow pipeline from idea to deploy">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
    <linearGradient id="flowStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity=".5"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset=".18" stop-color="#7aa2f7"/>
      <stop offset=".5" stop-color="#bb9af7"/>
      <stop offset=".82" stop-color="#9ece6a"/>
      <stop offset="1" stop-color="#9ece6a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="817" height="147" rx="14" fill="url(#flowBg)"/>
  <rect x="1.5" y="1.5" width="817" height="147" rx="14" fill="none" stroke="url(#flowStroke)" stroke-width="1.5"/>

  <!-- pipeline wire -->
  <rect x="40" y="60" width="740" height="4" rx="2" fill="#16161e"/>
  <rect x="40" y="60" width="740" height="4" rx="2" fill="url(#pipeGrad)">
    <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- traveling spark -->
  <circle r="4" fill="#c0caf5">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 40 62 L 780 62"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="13.5" font-weight="600" text-anchor="middle">
    <g>
      <rect x="40" y="42" width="108" height="40" rx="10" fill="#16161e" stroke="#7aa2f7" stroke-opacity=".6"/>
      <text x="94" y="67" fill="#7aa2f7">Understand</text>
    </g>
    <g>
      <rect x="176" y="42" width="96" height="40" rx="10" fill="#16161e" stroke="#bb9af7" stroke-opacity=".6"/>
      <text x="224" y="67" fill="#bb9af7">Analyze</text>
    </g>
    <g>
      <rect x="300" y="42" width="96" height="40" rx="10" fill="#16161e" stroke="#ff9e64" stroke-opacity=".6"/>
      <text x="348" y="67" fill="#ff9e64">Design</text>
    </g>
    <g>
      <rect x="424" y="42" width="84" height="40" rx="10" fill="#16161e" stroke="#e0af68" stroke-opacity=".6"/>
      <text x="466" y="67" fill="#e0af68">Build</text>
    </g>
    <g>
      <rect x="536" y="42" width="92" height="40" rx="10" fill="#16161e" stroke="#9ece6a" stroke-opacity=".6"/>
      <text x="582" y="67" fill="#9ece6a">Deploy</text>
    </g>
    <g>
      <rect x="656" y="42" width="108" height="40" rx="10" fill="#16161e" stroke="#73daca" stroke-opacity=".6"/>
      <text x="710" y="67" fill="#73daca">Improve ♻</text>
    </g>
  </g>

  <text x="410" y="122" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#565f89">the loop I run on every product — and on myself</text>
</svg>
